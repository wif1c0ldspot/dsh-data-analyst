# dsh-data-analyst closed-host profile patch. Applied over the
# @deepseek-ai/dsh-base bundle's own cordis.patch.yml (dsh-base@0.1.5-rc.2,
# matching ../../profiles/data-analyst/upstream-lock.json). See
# docs/dsh-compatibility.md and docs/implementation.md "Safety and policy
# boundaries" for the runtime-evidence requirement this patch satisfies: a
# verified, explicit positive tool allowlist with no shell, filesystem,
# network, subagent, or code-execution tool reachable.
#
# Every row base inserts is disabled here EXCEPT `tools` (the registry),
# `system-prompt` (prompt plumbing), and the dependency-free `timer` +
# `repeat-tool-reminder` services (no model tool, no filesystem/network access).
# This id list was generated mechanically from the installed
# @deepseek-ai/dsh-base@0.1.5-rc.2 package's own cordis.patch.yml (every
# `insert` row id, minus the two kept above) — see
# tests/closed-profile-tool-inventory.integration.test.ts, which re-derives
# the same list at test time so this file cannot silently drift from a future
# dsh-base upgrade without the test catching it. Disabled rows are never
# imported by the Cordis Loader, so this also avoids depending on optional
# native subcomponents (node-pty, koffi, etc.) that back the shell/sandbox
# rows we do not use.
