# The four analyst tool plugins (see docs/implementation.md "Safety and
# policy boundaries"). Paths are anchored relative to this file by
# @deepseek-ai/dsh-app-boot's loader (loadOverlayPatches).
#
# scripts/configure-installed-profile.mjs splits this file on the exact text
# "# The four analyst tool plugins" to build the closed-host profile patch —
# keep that marker line intact if you edit this comment, and see that
# script's own comment for why a missing marker now fails loudly instead of
# silently keeping the whole file.
- insert:
    - id: data-analyst-duckdb
      name: ../../packages/dsh-data-duckdb/dist/index.js
    - id: data-analyst-kaggle
      name: ../../packages/dsh-data-kaggle/dist/index.js
    - id: data-analyst-viz
      # Root-level re-export, not a path straight into packages/dsh-data-viz/:
      # client-face discovery walks up from the resolved module file to its
      # nearest package.json, so a path inside packages/dsh-data-viz/ would
      # find that sub-package's own manifest instead of the root package that
      # owns the dsh.client face (see packages/dsh-data-viz/client.js and
      # client-plugin-entry.js). A bare `dsh-data-analyst` specifier (as
      # cordis.bundle.patch.yml uses for the installed-plugin path) does not
      # work here: this file's dev boot has no `node_modules/dsh-data-analyst`
      # self-reference link, unlike an installed plugin's harness checkout.
      name: ../../client-plugin-entry.js
    - id: data-analyst-workbench
      name: ../../packages/dsh-data-workbench/dist/index.js
